<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Circle Pack</title>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: sans-serif;
        background: #f3f4f6;
      }
      text {
        paint-order: stroke;
        stroke: #ffffff;
        stroke-width: 2px;
      }
      #chart {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="chart"></div>

    <script type="module">
      window.addEventListener('message', onData);

      function onData(evt) {
        const { type, payload } = evt.data ?? {};
        if (type !== 'arbor:data' || !payload) return;   // ignore noise
        const svg = drawCirclePack(payload);
        document.getElementById('chart').appendChild(svg);
      }

      function drawCirclePack(data) {
        // Always use the smaller screen edge so the chart never overflows
        const size = Math.min(window.innerWidth, window.innerHeight);
        let width = size;
        let height = size;

        const pack = d3.pack().size([width, height]).padding(3);
        const root = pack(
          d3.hierarchy(data)
            .sum(d => d.value)
            .sort((a, b) => b.value - a.value)
        );

        const color = d3.scaleSequential(d3.interpolateBlues).domain([0, root.height]);

        const svg = d3.create("svg")
          .attr("viewBox", `-${width / 2} -${height / 2} ${width} ${height}`)
          .attr("width", "100%")
          .attr("height", "100%")
          .attr("style", `display:block; background:${color(0)}; cursor:pointer;`);

        const node = svg.append("g")
          .selectAll("circle")
          .data(root.descendants().slice(1))
          .join("circle")
          .attr("fill", d => (d.children ? color(d.depth) : "#ffffff"))
          .attr("pointer-events", d => (!d.children ? "none" : null))
          .on("mouseover", function () {
            d3.select(this).attr("stroke", "#111");
          })
          .on("mouseout", function () {
            d3.select(this).attr("stroke", null);
          })
          .on("click", (event, d) => focus !== d && (zoom(event, d), event.stopPropagation()));

        const label = svg.append("g")
          .attr("text-anchor", "middle")
          .selectAll("text")
          .data(root.descendants())
          .join("text")
          .style("font-weight", 600)
          .style("fill-opacity", d => (d.parent === root ? 1 : 0))
          .style("display", d => (d.parent === root ? "inline" : "none"));

        svg.on("click", event => zoom(event, root));

        let focus = root;
        let view;
        zoomTo([focus.x, focus.y, focus.r * 2]);

        // ──────────────────────────────────────────────────────────────────────
        // Helpers
        // ──────────────────────────────────────────────────────────────────────
        function wrapText(textSelection, radiusPx, fontPx) {
          const maxCharsPerLine = Math.max(4, Math.floor((radiusPx * 2) / (fontPx * 0.6)));
          textSelection.each(function (d) {
            const words = d.data.name.split(/\s+/);
            const lines = [];
            let line = [];
            for (const w of words) {
              const testLine = [...line, w].join(" ");
              if (testLine.length > maxCharsPerLine && line.length) {
                lines.push(line.join(" "));
                line = [w];
              } else {
                line.push(w);
              }
            }
            if (line.length) lines.push(line.join(" "));
            const el = d3.select(this);
            el.selectAll("tspan").remove();
            for (const [i, l] of lines.entries()) {
              el.append("tspan")
                .attr("x", 0)
                .attr("dy", i === 0 ? "0" : "1em")
                .text(l);
            }
          });
        }

        function zoomTo(v) {
          const k = width / v[2];
          view = v;
          label
            .attr("transform", d => `translate(${(d.x - v[0]) * k},${(d.y - v[1]) * k})`)
            .each(function (d) {
              const font = Math.max(16, (d.r * k) / (d.data.name.length * 0.5 + 1));
              d3.select(this).style("font-size", `${font}px`);
              wrapText(d3.select(this), d.r * k, font);
            });
          node
            .attr("transform", d => `translate(${(d.x - v[0]) * k},${(d.y - v[1]) * k})`)
            .attr("r", d => d.r * k);
        }

        function zoom(event, d) {
          focus = d;
          const transition = svg
            .transition()
            .duration(event.altKey ? 7500 : 750)
            .tween("zoom", () => {
              const i = d3.interpolateZoom(view, [focus.x, focus.y, focus.r * 2]);
              return t => zoomTo(i(t));
            });

          label
            .filter(function (d) {
              return d.parent === focus || this.style.display === "inline";
            })
            .transition(transition)
            .style("fill-opacity", d => (d.parent === focus ? 1 : 0))
            .on("start", function (d) {
              if (d.parent === focus) this.style.display = "inline";
            })
            .on("end", function (d) {
              if (d.parent !== focus) this.style.display = "none";
            });
        }

        return svg.node();
      }
    </script>
  </body>
</html>
